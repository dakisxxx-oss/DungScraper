<text x="34" y="78" class="l" style="animation-delay:0.40s" fill="#e2e8f0"><tspan fill="#2dd4bf">$ </tspan>pip install git+https://github.com/dakisxxx-oss/DungScraper</text><text x="34" y="108" class="l" style="animation-delay:0.95s" fill="#94a3b8">Successfully installed dungscraper-0.6.0</text><text x="34" y="168" class="l" style="animation-delay:1.23s" fill="#e2e8f0"><tspan fill="#2dd4bf">$ </tspan>dungscraper research &quot;How does BM25 ranking work?&quot; --max-pages 5</text><text x="34" y="198" class="l" style="animation-delay:1.78s" fill="#2dd4bf" font-weight="700"># Research: How does BM25 ranking work?</text><text x="34" y="228" class="l" style="animation-delay:2.06s" fill="#94a3b8">10 passages from 5 pages, most relevant first. Numbers in brackets are sources.</text><text x="34" y="258" class="l" style="animation-delay:2.34s" fill="#94a3b8">1. **How Does BM25 Work?**: BM25 works by calculating a relevance score for each document… [2]</text><text x="34" y="288" class="l" style="animation-delay:2.62s" fill="#94a3b8">[2] How Does BM25 Ranking Algorithm Work? - https://blog.dailydoseofds.com/p/how-does-bm25…</text><text x="34" y="318" class="l" style="animation-delay:2.90s" fill="#64748b">[5 pages, 3371 ms, stopped by page_budget]</text><text x="34" y="378" class="l" style="animation-delay:3.18s" fill="#e2e8f0"><tspan fill="#2dd4bf">$ </tspan>dungscraper crawl https://www.python.org --local --strategy best_first --keywords download,windows</text><text x="34" y="408" class="l" style="animation-delay:3.73s" fill="#94a3b8">{ &quot;strategy&quot;: &quot;best_first&quot;, &quot;pages&quot;: [ { &quot;crawl_score&quot;: 0.4267, &quot;url&quot;: &quot;.../python-3152/&quot; }, …</text><text x="34" y="468" class="l" style="animation-delay:4.01s" fill="#64748b"># what your agent sees in Claude, Cursor or any MCP client:</text><text x="34" y="498" class="l" style="animation-delay:4.29s" fill="#fbbf24" font-weight="700">🦴 DungScraper v0.6.0 · read_focused · api · 574 ms<