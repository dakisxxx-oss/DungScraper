[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dungscraper"
version = "0.6.0"
description = "Local-first web access for AI agents: scrape, crawl, search, research and extract. MCP server, REST API and CLI. No API key."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DungScraper contributors" }]
keywords = [
  "mcp", "mcp-server", "web-scraping", "web-crawler", "ai-agents", "llm", "rag", "markdown",
  "firecrawl-alternative", "research-agent", "playwright", "proxy-rotation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx[socks]>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "trafilatura>=2.0",
  "readability-lxml>=0.8",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "markdownify>=1.1",
  "playwright>=1.48",
  "pymupdf>=1.24",
  "mammoth>=1.8",
  "redis>=5.0",
  "jsonschema>=4.23",
  "typer>=0.12",
  "mcp>=1.9",
  "protego>=0.3",
  "python-multipart>=0.0.9",
  "curl_cffi>=0.7",
  "dnspython>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "python-docx>=1.1", "pyyaml>=6"]
stealth = ["curl_cffi>=0.7", "patchright>=1.49", "camoufox>=0.4", "seleniumbase>=4.34"]

[project.urls]
Homepage = "https://github.com/dakisxxx-oss/DungScraper"
Repository = "https://github.com/dakisxxx-oss/DungScraper"
Documentation = "https://github.com/dakisxxx-oss/DungScraper/blob/main/docs/REFERENCE.md"
Changelog = "https://github.com/dakisxxx-oss/DungScraper/releases"
Issues = "https://github.com/dakisxxx-oss/DungScraper/issues"

[project.scripts]
dungscraper = "dungscraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dungscraper = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = [
  "integration: tests that fetch public pages on the internet",
]
filterwarnings = ["ignore::DeprecationWarning"]
