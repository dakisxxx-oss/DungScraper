[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dungscraper"
version = "0.5.0"
description = "Self-hostable web scraping and crawling for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "DungScraper contributors" }]
keywords = ["scraping", "crawling", "markdown", "mcp", "agents", "rag"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "trafilatura>=2.0",
  "readability-lxml>=0.8",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "markdownify>=1.1",
  "playwright>=1.48",
  "pymupdf>=1.24",
  "mammoth>=1.8",
  "redis>=5.0",
  "jsonschema>=4.23",
  "typer>=0.12",
  "mcp>=1.9",
  "protego>=0.3",
  "python-multipart>=0.0.9",
  "curl_cffi>=0.7",
  "dnspython>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "python-docx>=1.1"]
stealth = ["curl_cffi>=0.7", "patchright>=1.49", "camoufox>=0.4", "seleniumbase>=4.34"]

[project.urls]
Homepage = "https://github.com/dakisxxx-oss/DungScraper"
Issues = "https://github.com/dakisxxx-oss/DungScraper/issues"

[project.scripts]
dungscraper = "dungscraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dungscraper = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = [
  "integration: tests that fetch public pages on the internet",
]
filterwarnings = ["ignore::DeprecationWarning"]
