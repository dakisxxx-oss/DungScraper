name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install Chromium (a few tests render a page)
        run: python -m playwright install --with-deps chromium
      - name: Test (integration tests need the internet and are skipped)
        run: python -m pytest -q -m "not integration"
